
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b12">
  <title>AI ONE | Admin Login</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #dce6f2;
      background:
        radial-gradient(circle at top, #102b48, transparent 45%),
        #070b12;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      padding: 38px 30px;
      border: 1px solid #203750;
      border-radius: 18px;
      background: #0d1420;
      box-shadow: 0 20px 70px #0009;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #168cff;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin: 28px 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #91a4ba;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #29415b;
      border-radius: 9px;
      background: #070b12;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #168cff;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #168cff;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      min-height: 20px;
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: #ff7777;
    }

    footer {
      margin-top: 28px;
      text-align: center;
      color: #65788e;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="logo">AI ONE</div>
    <h1>Administrator Login</h1>
    <p class="subtitle">Secure access to your platform</p>

    <form id="loginForm">
      <label for="password">Admin Password</label>
      <input
        id="password"
        type="password"
        placeholder="Enter your admin password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Sign In
      </button>

      <div id="message" role="alert"></div>
    </form>

    <footer>AI ONE ADMINISTRATION · SECURE ACCESS</footer>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    async function checkSession() {
      try {
        const response = await fetch("/api/admin/session", {
          credentials: "same-origin",
          cache: "no-store"
        });

        if (response.ok) {
          window.location.replace("/admin/dashboard.html");
        }
      } catch {
        message.textContent = "Unable to verify session.";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "";
      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            password: passwordInput.value
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || "Login failed.");
        }

        passwordInput.value = "";
        await checkSession();

        if (!window.location.pathname.includes("dashboard")) {
          message.textContent = "Session verification failed.";
        }

      } catch (error) {
        message.textContent = error.message || "Login failed.";
      } finally {
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });

    checkSession();
  </script>
</body>
</html>
