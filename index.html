<script>
"use strict";

/*
  AI ONE
  Public tools are loaded from the Cloudflare D1 API.

  API endpoint: /api/tools

  Contact:
  contactaione824@gmail.com
*/

const API_URL = "/api/tools";
const CONTACT_EMAIL = "contactaione824@gmail.com";

const main = document.getElementById("mainContent");

const params = new URLSearchParams(window.location.search);
const selectedTool = params.get("tool");

let tools = [];
let activeCategory = "ALL";
let loading = false;

/* HTML ESCAPING */

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[character]);
}

/* URL VALIDATION */

function safeURL(value){
  try{
    const url = new URL(String(value || "").trim());

    if(
      url.protocol === "https:" ||
      url.protocol === "http:"
    ){
      return url.href;
    }

    return "";
  }catch(error){
    return "";
  }
}

/* TOOL NORMALIZATION */

function normalizeTool(tool){

  if(!tool || typeof tool !== "object"){
    return null;
  }

  const name = String(tool.name || "Unnamed Tool");

  const features = Array.isArray(tool.features)
    ? tool.features
        .filter(item =>
          typeof item === "string" ||
          typeof item === "number"
        )
        .map(item => String(item).slice(0,500))
    : [];

  const rawStatus = String(
    tool.status || "active"
  ).toLowerCase();

  const featured =
    tool.featured === true ||
    tool.featured === 1 ||
    tool.featured === "1" ||
    String(tool.featured).toLowerCase() === "true";

  return {
    id: String(tool.id || tool.slug || ""),
    slug: String(tool.slug || tool.id || ""),
    name: name.slice(0,150),
    category: String(
      tool.category || "OTHER"
    ).toUpperCase().slice(0,60),

    letter: String(
      tool.letter || name.charAt(0) || "A"
    ).charAt(0).toUpperCase(),

    url: safeURL(tool.url),

    description: String(
      tool.description || ""
    ).slice(0,2000),

    about: String(
      tool.about || tool.description || ""
    ).slice(0,5000),

    features,

    featured,

    status: rawStatus
  };
}

/* LOADING */

function showLoading(){

  main.innerHTML = `
    <div class="container" style="padding:80px 0">
      <div class="loading-state" role="status">
        Loading AI ONE tools...
      </div>
    </div>
  `;
}

/* ERROR HANDLING */

function showLoadError(){

  main.innerHTML = `
    <div class="container" style="padding:80px 0">
      <div class="error-state" role="alert">

        <strong>Unable to load AI ONE tools</strong>

        <p>
          We could not connect to the tools database.
          Please check your connection and try again.
        </p>

        <button type="button" id="retryLoad">
          Try Again
        </button>

      </div>
    </div>
  `;

  const retryButton = document.getElementById("retryLoad");

  if(retryButton){
    retryButton.addEventListener("click", loadTools);
  }
}

/* LOAD DATABASE TOOLS */

async function loadTools(){

  if(loading) return;

  loading = true;

  showLoading();

  try{

    const response = await fetch(API_URL, {

      method:"GET",

      cache:"no-store",

      credentials:"same-origin",

      headers:{
        "Accept":"application/json"
      }

    });

    if(!response.ok){

      throw new Error(
        "API request failed: " + response.status
      );

    }

    const data = await response.json();

    if(
      !data ||
      data.success !== true ||
      !Array.isArray(data.tools)
    ){

      throw new Error("Invalid tools API response");

    }

    const normalized = data.tools
      .map(normalizeTool)
      .filter(Boolean);

    tools = normalized.filter(tool =>
      tool.status === "active" &&
      tool.slug.trim().length > 0
    );

    if(selectedTool){

      renderDetails(selectedTool);

    }else{

      renderHome();

    }

  }catch(error){

    console.error("AI ONE loading error:", error);

    showLoadError();

  }finally{

    loading = false;

  }
}

/* CATEGORIES */

function getCategories(){

  return [
    "ALL",

    ...new Set(
      tools
        .map(tool => tool.category)
        .filter(Boolean)
        .sort()
    )

  ];

}

          item.setAttribute(

          );

/* GLOBAL SEARCH SHORTCUT */

document.addEventListener("keydown", event => {

  const searchInput =
    document.getElementById("searchInput");

  if(!searchInput) return;

  if(
    event.key === "/" &&
    !event.ctrlKey &&
    !event.metaKey &&
    !event.altKey &&
    !["INPUT","TEXTAREA"].includes(
      document.activeElement?.tagName
    )
  ){

    event.preventDefault();

    searchInput.focus();

  }

  if(
    event.key === "Escape" &&
    document.activeElement === searchInput
  ){

    searchInput.value = "";

    searchInput.dispatchEvent(
      new Event("input")
    );

    searchInput.blur();

  }

});
