<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b12">
<meta name="description" content="AI ONE — Discover powerful artificial intelligence tools in one destination.">
<title>AI ONE — Discover Intelligence</title>

<style>
:root{
  --bg:#070b12;
  --panel:#0d1420;
  --panel2:#111c2b;
  --blue:#168cff;
  --blue2:#00c8ff;
  --silver:#dce6f2;
  --muted:#91a0b4;
  --border:rgba(130,170,220,.16);
  --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:#fff;
  line-height:1.6;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
button{cursor:pointer}
.container{width:min(1160px,92%);margin:auto}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,11,18,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}
.nav{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:900;
  letter-spacing:1.5px;
  color:var(--silver);
  white-space:nowrap;
}
.logo-mark{
  width:37px;
  height:37px;
  display:grid;
  place-items:center;
  border:1px solid rgba(22,140,255,.65);
  border-radius:12px;
  color:var(--blue2);
  font-size:22px;
  font-weight:900;
  box-shadow:0 0 20px rgba(22,140,255,.16);
}
.logo span{color:var(--blue2)}
.nav-links{
  display:flex;
  align-items:center;
  gap:25px;
}
.nav-links a{
  color:var(--muted);
  font-size:13px;
  font-weight:bold;
  transition:.2s;
}
.nav-links a:hover{color:var(--blue2)}
.nav-cta{
  background:linear-gradient(110deg,var(--blue),var(--blue2));
  color:#fff!important;
  padding:10px 16px;
  border-radius:10px;
}

/* HERO */
.hero{
  position:relative;
  padding:100px 0 75px;
  text-align:center;
  overflow:hidden;
}
.hero:before{
  content:"";
  position:absolute;
  width:600px;
  height:400px;
  left:50%;
  top:-220px;
  transform:translateX(-50%);
  background:rgba(0,130,255,.17);
  filter:blur(100px);
  pointer-events:none;
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border:1px solid rgba(22,140,255,.35);
  background:rgba(22,140,255,.08);
  border-radius:30px;
  color:var(--blue2);
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;
  position:relative;
}
.hero h1{
  max-width:850px;
  margin:24px auto 18px;
  font-size:clamp(40px,7vw,76px);
  line-height:1.08;
  letter-spacing:-2.5px;
}
.gradient-text{
  background:linear-gradient(100deg,#fff,#7dc7ff,#168cff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.hero p{
  max-width:650px;
  margin:0 auto;
  color:var(--muted);
  font-size:16px;
}
.hero-actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  margin-top:30px;
}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:13px 21px;
  border-radius:11px;
  font-size:13px;
  font-weight:bold;
  transition:.2s;
}
.btn-primary{
  color:#fff;
  background:linear-gradient(110deg,var(--blue),#006bd6);
  box-shadow:0 8px 25px rgba(22,140,255,.2);
}
.btn-secondary{
  color:var(--silver);
  border:1px solid var(--border);
  background:rgba(255,255,255,.025);
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}
.stats{
  display:flex;
  justify-content:center;
  gap:65px;
  margin-top:65px;
}
.stat strong{
  display:block;
  color:var(--blue2);
  font-size:30px;
}
.stat span{
  color:var(--muted);
  font-size:10px;
  letter-spacing:1.5px;
  font-weight:bold;
}

/* SECTION */
section{padding:55px 0}
.section-heading{
  margin-bottom:27px;
}
.section-heading h2{
  font-size:clamp(25px,4vw,34px);
  letter-spacing:-.7px;
}
.section-heading p{
  color:var(--muted);
  margin-top:6px;
  font-size:14px;
}
.section-label{
  color:var(--blue2);
  font-size:10px;
  letter-spacing:2px;
  font-weight:bold;
  margin-bottom:8px;
}

/* FEATURED */
.featured-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}
.featured-card{
  display:block;
  position:relative;
  overflow:hidden;
  padding:25px;
  min-height:205px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:linear-gradient(145deg,#111d2c,#0b111b);
  transition:.25s;
}
.featured-card:after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  right:-60px;
  bottom:-80px;
  border-radius:50%;
  background:rgba(22,140,255,.15);
  filter:blur(35px);
}
.featured-card:hover{
  border-color:rgba(22,140,255,.65);
  transform:translateY(-4px);
}
.featured-tag{
  color:var(--blue2);
  font-size:10px;
  font-weight:bold;
  letter-spacing:1.5px;
}
.featured-card h3{
  font-size:22px;
  margin:15px 0 7px;
}
.featured-card p{
  color:var(--muted);
  font-size:13px;
}
.featured-link{
  display:inline-block;
  color:var(--blue2);
  font-size:12px;
  font-weight:bold;
  margin-top:16px;
}

/* SEARCH */
.explore-section{
  border-top:1px solid var(--border);
}
.search-panel{
  padding:20px;
  border:1px solid var(--border);
  border-radius:18px;
  background:linear-gradient(145deg,#101a28,#0b111b);
  margin-bottom:22px;
}
.search-box{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:55px;
  padding:0 16px;
  border:1px solid rgba(22,140,255,.35);
  border-radius:13px;
  background:#080e17;
  transition:.2s;
}
.search-box:focus-within{
  border-color:var(--blue2);
  box-shadow:0 0 0 3px rgba(0,200,255,.09);
}
.search-icon{
  color:var(--blue2);
  font-size:19px;
}
.search-box input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  color:#fff;
  background:transparent;
  font-size:14px;
}
.search-box input::placeholder{color:#718198}
.clear-search{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:20px;
  padding:5px;
  display:none;
}
.clear-search.show{display:block}
.search-hint{
  color:#78899f;
  font-size:11px;
  margin:10px 3px 0;
}
.filter-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:25px 0 12px;
}
.filter-heading strong{font-size:12px;color:var(--silver)}
.filter-heading span{font-size:11px;color:var(--muted)}
.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.filter-btn{
  border:1px solid var(--border);
  border-radius:30px;
  padding:8px 13px;
  color:var(--muted);
  background:#0a111b;
  font-size:11px;
  transition:.2s;
}
.filter-btn:hover,.filter-btn.active{
  color:#fff;
  border-color:var(--blue);
  background:rgba(22,140,255,.16);
}
.results-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:22px 2px 15px;
  color:var(--muted);
  font-size:12px;
}
.results-line strong{color:var(--blue2)}

/* TOOL CARDS */
.tools-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}
.tool-card{
  display:block;
  min-width:0;
  padding:21px;
  border:1px solid var(--border);
  border-radius:17px;
  background:linear-gradient(145deg,#101a28,#0b111a);
  transition:.22s;
}
.tool-card:hover{
  transform:translateY(-4px);
  border-color:rgba(22,140,255,.55);
  box-shadow:0 12px 30px rgba(0,0,0,.2);
}
.tool-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}
.tool-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:rgba(22,140,255,.12);
  border:1px solid rgba(22,140,255,.2);
  color:var(--blue2);
  font-weight:900;
  font-size:18px;
}
.tool-category{
  color:var(--blue2);
  font-size:9px;
  font-weight:bold;
  letter-spacing:1px;
  text-align:right;
}
.tool-card h3{font-size:17px;margin-bottom:7px}
.tool-card p{
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}
.card-link{
  display:inline-block;
  margin-top:16px;
  color:var(--blue2);
  font-size:11px;
  font-weight:bold;
}
.no-results{
  display:none;
  text-align:center;
  padding:50px 15px;
  border:1px dashed var(--border);
  border-radius:16px;
  color:var(--muted);
}
.no-results strong{
  display:block;
  color:var(--silver);
  font-size:18px;
  margin-bottom:8px;
}

/* ABOUT */
.about-box{
  padding:40px;
  border:1px solid var(--border);
  border-radius:22px;
  background:linear-gradient(120deg,#101b2b,#0b111a);
  text-align:center;
}
.about-box h2{font-size:27px;margin-bottom:10px}
.about-box p{
  max-width:700px;
  margin:auto;
  color:var(--muted);
  font-size:14px;
}
.about-box .btn{margin-top:22px}

/* DETAIL PAGE */
.detail-wrap{
  min-height:75vh;
  padding:45px 0 75px;
}
.back-link{
  display:inline-block;
  color:var(--blue2);
  font-size:13px;
  font-weight:bold;
  margin-bottom:30px;
}
.detail-card{
  max-width:850px;
  margin:auto;
  padding:clamp(24px,5vw,48px);
  border:1px solid var(--border);
  border-radius:23px;
  background:linear-gradient(145deg,#111d2c,#0a111b);
}
.detail-icon{
  width:65px;
  height:65px;
  display:grid;
  place-items:center;
  border-radius:17px;
  background:rgba(22,140,255,.13);
  color:var(--blue2);
  font-size:26px;
  font-weight:900;
  margin-bottom:20px;
}
.detail-category{
  color:var(--blue2);
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;
}
.detail-card h1{
  font-size:clamp(34px,6vw,52px);
  margin:8px 0;
}
.detail-description{
  color:var(--muted);
  font-size:15px;
  margin-bottom:35px;
}
.detail-card h2{
  font-size:21px;
  margin:25px 0 10px;
}
.detail-card p{color:var(--muted);font-size:14px}
.feature-list{
  list-style:none;
  margin-top:12px;
}
.feature-list li{
  padding:10px 0;
  border-bottom:1px solid var(--border);
  color:var(--silver);
  font-size:14px;
}
.feature-list li:before{
  content:"✓";
  color:var(--blue2);
  margin-right:10px;
  font-weight:bold;
}
.detail-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:30px;
}
.not-found{text-align:center;padding:80px 15px}

/* FOOTER */
footer{
  border-top:1px solid var(--border);
  padding:28px 0;
  color:var(--muted);
  font-size:12px;
}
.footer-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}
.footer-brand{font-weight:900;color:var(--silver);letter-spacing:1px}
.footer-brand span{color:var(--blue2)}

/* MOBILE */
@media(max-width:800px){
  .featured-grid,.tools-grid{grid-template-columns:repeat(2,1fr)}
  .stats{gap:35px}
  .nav-links{gap:14px}
  .nav-links a{font-size:11px}
}
@media(max-width:560px){
  .container{width:91%}
  .nav{min-height:65px}
  .logo{font-size:19px}
  .logo-mark{width:33px;height:33px}
  .nav-links{gap:11px}
  .nav-links a{font-size:10px}
  .nav-links .nav-cta{padding:8px 10px}
  .hero{padding:75px 0 50px}
  .hero h1{font-size:43px;letter-spacing:-1.5px}
  .hero p{font-size:14px}
  .stats{gap:0;justify-content:space-around;margin-top:45px}
  .stat strong{font-size:25px}
  .stat span{font-size:8px;letter-spacing:1px}
  section{padding:42px 0}
  .featured-grid,.tools-grid{grid-template-columns:1fr}
  .featured-card{min-height:175px}
  .tool-card{padding:19px}
  .search-panel{padding:14px}
  .search-box{min-height:51px;padding:0 12px}
  .search-box input{font-size:13px}
  .filters{
    flex-wrap:nowrap;
    overflow-x:auto;
    padding-bottom:8px;
    scrollbar-width:thin;
  }
  .filter-btn{white-space:nowrap;flex-shrink:0}
  .about-box{padding:28px 20px}
  .footer-inner{flex-direction:column;text-align:center}
  .detail-wrap{padding-top:30px}
  .detail-actions{flex-direction:column}
  .detail-actions .btn{width:100%}
}
</style>
</head>

    <span class="search-icon">⌕</span>
    <input id="searchInput" type="search" placeholder="Search AI tools, categories or features..." autocomplete="off" aria-label="Search AI tools">
    <button class="clear-search" id="clearSearch" aria-label="Clear search">×</button>
   </div>
   <div class="search-hint">Search by tool name, category or what you want to do.</div>
   <div class="filter-heading">
    <strong>Browse by category</strong>
    <span>Choose a category</span>
   </div>
   <div class="filters" id="filters"></div>
  </div>

  <div class="results-line">
   <span id="resultsCount">Showing 17 tools</span>
   <span>AI ONE COLLECTION</span>
  </div>
  <div class="tools-grid" id="toolsGrid"></div>
  <div class="no-results" id="noResults">
   <strong>No tools found</strong>
   Try another search term or choose a different category.
  </div>
 </div>
</section>

<section id="about">
 <div class="container">
  <div class="about-box">
   <div class="section-label">ABOUT AI ONE</div>
   <h2>One Platform. Endless Possibilities.</h2>
   <p>AI ONE brings powerful artificial intelligence tools together in one destination, helping everyone discover new ways to create, learn, work and innovate.</p>
   <a href="#tools" class="btn btn-primary">Explore the Collection →</a>
  </div>
 </div>
</section>
`;

const featuredSlugs=["chatgpt","claude","gemini"];
document.getElementById("featuredGrid").innerHTML=featuredSlugs.map(slug=>{
 const t=tools.find(x=>x.slug===slug);
 return `
 <a class="featured-card" href="?tool=${t.slug}">
  <span class="featured-tag">✦ FEATURED TOOL</span>
  <h3>${t.name}</h3>
  <p>${t.description}</p>
  <span class="featured-link">Explore ${t.name} →</span>
 </a>`;
}).join("");

document.getElementById("filters").innerHTML=categories.map((c,i)=>
 `<button class="filter-btn ${i===0?"active":""}" data-filter="${c}">${c==="ALL"?"All Tools":c}</button>`
).join("");

let activeCategory="ALL";
const searchInput=document.getElementById("searchInput");
const clearButton=document.getElementById("clearSearch");

function updateTools(){
 const query=searchInput.value.trim().toLowerCase();
 clearButton.classList.toggle("show",query.length>0);

 const filtered=tools.filter(t=>{
  const categoryMatch=activeCategory==="ALL"||t.category===activeCategory;
  const searchable=[t.name,t.category,t.description,t.about,...t.features].join(" ").toLowerCase();
  return categoryMatch&&searchable.includes(query);
 });

 document.getElementById("toolsGrid").innerHTML=filtered.map(t=>`
  <a class="tool-card" href="?tool=${t.slug}">
   <div class="tool-top">
    <div class="tool-icon">${t.letter}</div>
    <span class="tool-category">${t.category}</span>
   </div>
   <h3>${t.name}</h3>
   <p>${t.description}</p>
   <span class="card-link">Explore ${t.name} →</span>
  </a>
 `).join("");

 document.getElementById("resultsCount").innerHTML=
  `Showing <strong>${filtered.length}</strong> of 17 tools`;

 document.getElementById("noResults").style.display=
  filtered.length===0?"block":"none";
 document.getElementById("toolsGrid").style.display=
  filtered.length===0?"none":"grid";
}

searchInput.addEventListener("input",updateTools);

clearButton.addEventListener("click",()=>{
 searchInput.value="";
 updateTools();
 searchInput.focus();
});

document.getElementById("filters").addEventListener("click",e=>{
 const button=e.target.closest(".filter-btn");
 if(!button)return;
 activeCategory=button.dataset.filter;
 document.querySelectorAll(".filter-btn").forEach(b=>
  b.classList.toggle("active",b===button)
 );
 updateTools();
});

document.addEventListener("keydown",e=>{
 if(e.key==="/"&&document.activeElement!==searchInput){
  e.preventDefault();
  searchInput.focus();
 }
 if(e.key==="Escape"&&document.activeElement===searchInput){
  searchInput.value="";
  updateTools();
  searchInput.blur();
 }
});

updateTools();
}

function renderDetails(slug){
 const t=tools.find(x=>x.slug===slug);

 if(!t){
  document.title="Tool Not Found — AI ONE";
  main.innerHTML=`
   <div class="container not-found">
    <h1>Tool Not Found</h1>
    <p style="color:var(--muted);margin:12px 0 25px">The tool you are looking for could not be found.</p>
    <a class="btn btn-primary" href="./">Back to AI ONE</a>
   </div>`;
  return;
 }

 document.title=t.name+" — AI ONE";

 main.innerHTML=`
 <section class="detail-wrap">
  <div class="container">
   <a class="back-link" href="./">← Back to All AI Tools</a>
   <article class="detail-card">
    <div class="detail-icon">${t.letter}</div>
    <div class="detail-category">${t.category}</div>
    <h1>${t.name}</h1>
    <p class="detail-description">${t.description}</p>

    <h2>About ${t.name}</h2>
    <p>${t.about}</p>

    <h2>Key Features</h2>
    <ul class="feature-list">
     ${t.features.map(feature=>`<li>${feature}</li>`).join("")}
    </ul>

    <div class="detail-actions">
     <a class="btn btn-primary" href="${t.url}" target="_blank" rel="noopener noreferrer">Visit Official Website ↗</a>
     <a class="btn btn-secondary" href="./">Explore More Tools</a>
    </div>
   </article>
  </div>
 </section>`;
}

if(selectedTool){
 renderDetails(selectedTool);
}else{
 renderHome();
}
</script>
</body>
</html>
